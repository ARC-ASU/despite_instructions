[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covert-agents"
version = "0.1.0"
description = "Reproducible experiments on agents forming covert communication channels"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/ARC-ASU/despite_instructions"
Paper = "https://arxiv.org/abs/2609.32701"
Issues = "https://github.com/ARC-ASU/despite_instructions/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
covert-agents = "covert_agents.__main__:main"

[tool.setuptools.packages.find]
include = ["covert_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
